    <script src="fixtures-data.js"></script>
    <script>
      // --- DISPLAY FIXTURES FROM DB

      async function FetchMatches() {
        const seasonSelect = document.getElementById("season-select");
        const season = seasonSelect ? seasonSelect.value : "2025-26";
        const endpoint = SEASON_ENDPOINTS[season] || SEASON_ENDPOINTS["2025-26"];

        let fixtures_container = document.querySelector(".fixtures-container");
        fixtures_container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
            <div class="loading-spinner"></div>
            <p style="font-size: var(--fs-md); color: var(--primary-blue);">Loading Fixtures...</p>
          </div>`;

        try {
          const res = await fetch(endpoint);
          const data = await res.json();
          console.log("Fetched fixtures data:", data);

          fixtures_container.innerHTML = "";

          if (data.length === 0) {
            fixtures_container.innerHTML = `
              <div style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
                <p style="font-size: var(--fs-md); color: var(--primary-blue);">No fixtures available at the moment. Please check back later.</p>
              </div>`;
            return;
          }

          let fixtures = "";

          // The feed comes back unsorted. Show what is coming next first
          // (soonest at the top), then results, most recent first.
          const ordered = data.slice().sort((a, b) => {
            const aUp = matchStatus(a, season) === "Upcoming";
            const bUp = matchStatus(b, season) === "Upcoming";
            if (aUp !== bUp) return aUp ? -1 : 1;
            const aT = (parseMatchDate(a.match_date, season) || 0) &&
              parseMatchDate(a.match_date, season).getTime();
            const bT = (parseMatchDate(b.match_date, season) || 0) &&
              parseMatchDate(b.match_date, season).getTime();
            return aUp ? aT - bT : bT - aT;
          });

          ordered.forEach((element) => {
            const status = matchStatus(element, season);
            const statusClass =
              status === "Upcoming" ? "status-upcoming" : "status-completed";

            // An unplayed match has no score to show, whether the feed sent
            // null or a placeholder 0.
            const homeScore = status === "Upcoming" ? "-" : element.home_score;
            const awayScore = status === "Upcoming" ? "-" : element.away_score;

            const homeName = displayTeamName(element.home_team_name);
            const awayName = displayTeamName(element.away_team_name);
            const calendarISO = calendarStamp(element, season);

            // Check if it's a home or away game
            const isHomeGame = isOurClub(element.home_team_name);

            fixtures += `
              <div class="fixture-card" data-status="${status.toLowerCase()}" data-location="${
              isHomeGame ? "home" : "away"
            }" data-competition = "${element.game_type.toLowerCase()}">
                <div class="teams">
                  <div class="team">
                    <img src="${crestFor(element.home_team_img)}" alt="${
              homeName
            } crest" onerror="crestFallback(this)" width="60" height="60" loading="lazy" />
                    <p>${homeName}</p>
                    <div class="score">${homeScore}</div>
                  </div>
                  <span class="vs">VS</span>
                  <div class="team">
                    <img src="${crestFor(element.away_team_img)}" alt="${
              awayName
            } crest" onerror="crestFallback(this)" width="60" height="60" loading="lazy" />
                    <p>${awayName}</p>
                    <div class="score">${awayScore}</div>
                  </div>
                </div>
                <div class="fixture-details">
                  <p>
                    <strong>Date:</strong> ${formatMatchDate(
                      element.match_date,
                      season
                    )}
                    <span class="match-status ${statusClass}">${status}</span>
                  </p>
                  <p><strong>Time:</strong> ${formatMatchTime(
                    element.match_time
                  )}</p>
                  <p><strong>Location:</strong> ${element.location} ${
              isHomeGame
                ? '<i class="fas fa-home" style="color: var(--primary-blue); margin-left: 5px;"></i>'
                : '<i class="fas fa-bus" style="color: var(--primary-blue); margin-left: 5px;"></i>'
            }</p>
            <p><strong>Competition:</strong> ${element.game_type}</p>
                  <div class="buttons">
                    ${
                      status === "Upcoming"
                        ? calendarISO
                          ? `<button><a href="#" class="add-to-calendar" data-start="${calendarISO}" data-title="${homeName} vs ${awayName}"> <i class="far fa-calendar-plus"></i> Remind Me</a></button>`
                          : ""
                        : `   <button class="highlight"><a target="_blank" href="https://youtube.com/@prospectfc?si=2Iwkjya99ywVvibE"> <i class="fab fa-youtube"></i> Highlights</a></button>
                    <button class="highlight"><a target="_blank" href="https://www.instagram.com/prospect.fc?utm_source=ig_web_button_share_sheet&igsh=MXFkZzdrY2h3Mm5qcQ=="> <i class="fab fa-instagram"></i> Photos</a></button>`
                    }
                  </div>
                </div>
              </div>
            `;
          });

          fixtures_container.innerHTML += fixtures;
          setupFilterButtons();
          setupCalendarButtons();
        } catch (error) {
          console.error("Error fetching fixtures:", error);
          fixtures_container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
              <p style="font-size: var(--fs-md); color: #e63946;">Failed to load fixtures. Please try again later.</p>
              <button onclick="FetchMatches()" style="margin-top: 1rem; padding: 0.5rem 1.5rem; background-color: var(--primary-blue); color: white; border: none; border-radius: var(--radius-xs); cursor: pointer;">Retry</button>
            </div>`;
        }
      }

      function setupFilterButtons() {
        const filterButtons = document.querySelectorAll(".filter-btn");
        const fixtureCards = document.querySelectorAll(".fixture-card");

        filterButtons.forEach((button) => {
          button.addEventListener("click", () => {
            // Update active button
            filterButtons.forEach((btn) => btn.classList.remove("active"));
            button.classList.add("active");

            const filter = button.getAttribute("data-filter");

            // Filter cards
            fixtureCards.forEach((card) => {
              const status = card.getAttribute("data-status");
              const location = card.getAttribute("data-location");
              const competition = card.getAttribute("data-competition");

              if (
                filter === "all" ||
                (filter === "upcoming" && status === "upcoming") ||
                (filter === "completed" && status === "completed") ||
                (filter === "home" && location === "home") ||
                (filter === "away" && location === "away") ||
                // "League" has to cover the 2026-27 naming too ("Division One
                // (GW1)"), and a League Cup tie is a cup game, not a league one.
                (filter === "league" &&
                  (competition.includes("league") ||
                    competition.includes("division")) &&
                  !competition.includes("cup")) ||
                (filter === "cup" && competition.includes("cup"))
              ) {
                card.style.display = "block";
              } else {
                card.style.display = "none";
              }
            });
          });
        });
      }

      function setupCalendarButtons() {
        const calendarButtons = document.querySelectorAll(".add-to-calendar");

        calendarButtons.forEach((button) => {
          button.addEventListener("click", function (e) {
            e.preventDefault();
            const title = this.getAttribute("data-title");

            // data-start is a real ISO timestamp built by calendarStamp(); the
            // old code did new Date("22/08" + " " + "KO TBC"), which was always
            // an Invalid Date for the current season.
            const startDateTime = new Date(this.getAttribute("data-start"));
            if (isNaN(startDateTime.getTime())) return;
            const endDateTime = new Date(
              startDateTime.getTime() + 90 * 60 * 1000
            ); // 90 minutes later

            // Format for Google Calendar
            const startISO = startDateTime
              .toISOString()
              .replace(/-|:|\.\d+/g, "");
            const endISO = endDateTime.toISOString().replace(/-|:|\.\d+/g, "");

            const googleCalendarUrl = `https://calendar.google.com/calendar/r/eventedit?text=${encodeURIComponent(
              title
            )}&dates=${startISO}/${endISO}&details=Prospect FC Match&location=${encodeURIComponent(
              "Prospect FC Ground"
            )}`;

            window.open(googleCalendarUrl, "_blank");
          });
        });
      }

      document
        .getElementById("season-select")
        .addEventListener("change", FetchMatches);

      window.onload = function () {
        FetchMatches();
        AOS.init({
          offset: 120,
          delay: 200,
          duration: 1000,
          easing: "ease-in-out",
          once: false,
          mirror: false,
        });
      };

      // Mobile menu toggle
      const menuToggle = document.getElementById("menu-toggle");
      const navMenu = document.getElementById("nav-menu");

      menuToggle.addEventListener("click", () => {
        const expanded = menuToggle.getAttribute("aria-expanded") === "true";
        menuToggle.setAttribute("aria-expanded", String(!expanded));
        navMenu.classList.toggle("active");
        menuToggle.classList.toggle("active");
      });
    </script>
