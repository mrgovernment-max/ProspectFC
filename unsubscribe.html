<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unsubscribe | Prospect FC</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
    <link rel="stylesheet" href="news.css" />
    <script defer src="news_unsubscribe.js"></script>
      <meta name="description" content="Unsubscribe from the Prospect FC newsletter." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://prospectfc.com/unsubscribe.html" />

    <!-- Social share cards (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prospect FC" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://prospectfc.com/unsubscribe.html" />
    <meta property="og:title" content="Unsubscribe | Prospect FC" />
    <meta property="og:description" content="Unsubscribe from the Prospect FC newsletter." />
    <meta property="og:image" content="https://res.cloudinary.com/dazhskqcc/image/upload/c_fill,g_auto,w_1200,h_630/v1758992545/showcase_game_captain_c4hokv.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Prospect FC players on the pitch" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unsubscribe | Prospect FC" />
    <meta name="twitter:description" content="Unsubscribe from the Prospect FC newsletter." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dazhskqcc/image/upload/c_fill,g_auto,w_1200,h_630/v1758992545/showcase_game_captain_c4hokv.jpg" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
/>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img
          src="https://res.cloudinary.com/dazhskqcc/image/upload/v1754336732/image0_1_sdm2cz.png"
          alt="Prospect FC Logo"
/>
        <div class="logo-text">Prospect <span>FC</span></div>
      </div>
    </header>

    <div class="container">
      <!-- Unsubscribe Page -->
      <div id="unsubscribe-page" class="result-card warning">
        <div class="icon-container">
          <i class="fas fa-envelope-open-text"></i>
        </div>
        <h2>Unsubscribe from Newsletter</h2>
        <p>
          We're sad to see you go! Clicking the button below will remove your
          email from our newsletter list. You will no longer receive updates,
          match highlights, or event announcements.
        </p>

        <input
          type="email"
          id="unsubscribe-email"
          placeholder="Enter your email"
          required
          style="
            margin-top: 1rem;
            padding: 0.8rem;
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius-pill);
            border: none;
            outline: none;
            font-size: var(--fs-base);
            text-align: center;
          "
/>

        <div class="btn-group">
          <button class="btn btn-outline" onclick="unsubscribeUser(event)">
            Unsubscribe
          </button>
          <a href="index.html" class="btn">Back to Home</a>
        </div>

        <p
          id="unsubscribe-status"
          style="margin-top: 1rem; color: var(--gray)"
        ></p>
      </div>
    </div>

    <footer>
      <div class="social-links">
        <a
          href="https://www.facebook.com/share/16ngpSmCGs/?mibextid=wwXIfr"
          target="_blank"
          ><i class="fab fa-facebook"></i
        ></a>
        <a href="https://www.instagram.com/prospect.fc" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://youtube.com/@prospectfc" target="_blank"
          ><i class="fab fa-youtube"></i
        ></a>
        <a href="https://www.tiktok.com/@prospect.fc" target="_blank"
          ><i class="fab fa-tiktok"></i
        ></a>
      </div>
      <p class="footer-text">
        &copy; <span class="js-year">2026</span> Prospect FC | East Berkshire Football League
      </p>
    </footer>
    <script data-id="js-year-script">
      document.querySelectorAll(".js-year").forEach(function (el) {
        el.textContent = new Date().getFullYear();
      });
    </script>
  </body>
</html>
