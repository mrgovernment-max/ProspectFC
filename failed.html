      :root {
        --gradient-dark: linear-gradient(180deg, #0d1526 0%, #070b14 100%);

        --glass-bg: rgba(13, 21, 38, 0.6);
        --glass-border: rgba(255, 255, 255, 0.09);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Montserrat", sans-serif;
        background: var(--gradient-dark);
        color: #fff;
        padding: 1.5rem;
      }
      .container {
        max-width: 460px;
        width: 100%;
        text-align: center;
        background: var(--glass-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        padding: 3rem 2rem;
        box-shadow: 0 8px 24px rgba(224, 61, 61, 0.25);
      }
      .failed {
        font-size: var(--fs-2xl);
        margin-bottom: 1rem;
        color: #ff8a8a;
      }
      .container p {
        color: #97a3b8;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      button {
        display: inline-block;
        padding: 0.85rem 2rem;
        background: var(--gradient-primary);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 6px 18px rgba(0, 45, 107, 0.35);
      }
      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(22, 104, 224, 0.4);
      }
